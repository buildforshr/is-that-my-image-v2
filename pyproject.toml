[project]
name = "ncid"
version = "0.1.0"
description = "Privacy-first local CLI to detect non-consensual use of your images online"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "Pillow>=10.3",
    "ImageHash>=4.3.1",
    "platformdirs>=4.2",
]

[project.scripts]
ncid = "ncid.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits real external APIs; excluded by default"]
addopts = "-m 'not live'"

[project.urls]
Homepage = "https://github.com/buildforshr/is-that-my-image-v2"
Source = "https://github.com/buildforshr/is-that-my-image-v2"
Issues = "https://github.com/buildforshr/is-that-my-image-v2/issues"
